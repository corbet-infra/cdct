[package]
name = "cdct"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"
description = "The conductor: one decision engine for RAM, CPU quotas and the exclusive GPU"
repository = "https://git.corbet.ch/corbet-infra/cdct"

[lib]
name = "cdct"
path = "src/lib.rs"

[[bin]]
name = "cdct"
path = "src/main.rs"

[dependencies]
cdrv = { git = "https://git.corbet.ch/corbet-infra/cdrv.git", branch = "main" }
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# `cdrv` is named by its git URL, so this crate builds from the URL alone.
# During local development the patch below resolves that URL to the sibling
# checkout instead; delete the table to build against the URL (see README).
[patch."https://git.corbet.ch/corbet-infra/cdrv.git"]
cdrv = { path = "../cdrv" }

[lints.rust]
unsafe_code = "forbid"
